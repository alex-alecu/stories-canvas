<!DOCTYPE html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf5ff" />
    <meta name="description" content="Creează povești ilustrate personalizate pentru copii, cu imagini, narațiune și povești publice de explorat." />
    <title>Povesti Magice</title>
    <link rel="icon" type="image/png" href="/icon-small.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link
      rel="preload"
      as="image"
      href="/logo-big-384.avif"
      type="image/avif"
      imagesrcset="/logo-big-256.avif 256w, /logo-big-384.avif 384w, /logo-big-512.avif 512w"
      imagesizes="(min-width: 1024px) 384px, (min-width: 768px) 320px, 78vw"
      fetchpriority="high"
    />
    <script>
      // FOUC prevention: apply dark class and background before first paint
      (function() {
        try {
          var theme = localStorage.getItem('stories-canvas:theme') || 'system';
          var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var themeColorMeta = document.querySelector('meta[name=\"theme-color\"]');
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.backgroundColor = '#000';
            if (themeColorMeta) themeColorMeta.setAttribute('content', '#0f0a1a');
          } else if (themeColorMeta) {
            themeColorMeta.setAttribute('content', '#faf5ff');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
